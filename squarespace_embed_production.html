<iframe
  id="bubble-chart-frame"
  src="https://YOUR-HOSTED-URL/word_bubbles_d3_production.html"
  title="Words by group: social media use"
  width="100%"
  style="border:0;display:block;width:100%;height:520px;"
  loading="lazy"
  allowfullscreen>
</iframe>
<script>
  window.addEventListener('message', function(event) {
    var data = event.data || {};
    if (data.type !== 'bubbleChartHeight' || !data.height) return;
    var iframe = document.getElementById('bubble-chart-frame');
    if (!iframe) return;
    iframe.style.height = Math.max(420, Math.ceil(data.height)) + 'px';
  });
</script>
